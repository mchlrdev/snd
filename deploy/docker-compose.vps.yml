# VPS compose file. Lives at /docker/snd/docker-compose.yml next to a .env with
# SND_PASSWORD and SND_SECRET. Pulls the image CI pushes to GHCR; nothing is built here.
# Traefik (/docker/traefik, network_mode: host) terminates TLS and routes via labels.
#
# Update: "Bereitstellen" in the Hostinger Docker Manager,
# or docker compose pull && docker compose up -d
name: snd

services:
  snd:
    image: ghcr.io/mchlrdev/snd:${SND_TAG:-latest}
    restart: unless-stopped
    environment:
      SND_PASSWORD: ${SND_PASSWORD:?Set SND_PASSWORD in .env}
      SND_SECRET: ${SND_SECRET:?Set SND_SECRET in .env}
      SND_DATA_DIR: /data
      SND_HOST: 0.0.0.0
      SND_PORT: "3000"
      SND_TRUST_PROXY: "1"
      SND_PUBLIC_URL: https://snd.mchlr.de
    volumes:
      # SQLite database. Survives pulls, recreates and `docker compose down`.
      - snd-data:/data
    # No published port: Traefik reaches the container on its bridge IP.
    labels:
      traefik.enable: "true"
      traefik.http.routers.snd.rule: Host(`snd.mchlr.de`)
      traefik.http.routers.snd.entrypoints: websecure
      traefik.http.routers.snd.tls: "true"
      traefik.http.routers.snd.tls.certresolver: letsencrypt
      traefik.http.services.snd.loadbalancer.server.port: "3000"

volumes:
  snd-data:
